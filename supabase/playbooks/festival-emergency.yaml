schemaVersion: 1
slug: temporary-structure-failure
version: 1
status: published
title: Temporary Structure Failure or Partial Collapse

appliesWhen: >
  A stage, scaffold, viewing platform, tent, tower, barrier system, roof element, or other temporary structure
  shows major instability, partial collapse, falling components, or a credible risk of further failure.

requiredInputs:
  - structureLocation
  - structureStatus
  - engineerAssessment
  - weatherStatus
  - casualtyReports
  - electricalFeeds
  - audienceByZone
  - approvedExclusionZones
  - approvedRoutes
  - currentRoster

decisionPoints:
  - id: exclusion-size
    owner: mo
    question: How large should the exclusion zone be based on engineering and emergency-service advice?
  - id: adjacent-operation-hold
    owner: mo
    question: Which adjacent stages, vendors, routes, or attractions must stop operating?
  - id: partial-or-full-evacuation
    owner: mo
    question: Is local clearance sufficient or is a broader evacuation required?

constraints:
  - id: no-entry-unstable-structure
    instruction: Staff must not enter, climb, pass beneath, or work inside an unstable structure unless specifically cleared.
  - id: engineer-clearance-required
    instruction: The structure and affected zone must not reopen without competent engineering clearance.
  - id: isolate-energy
    instruction: Electrical, mechanical, or fuel systems feeding the affected structure must be isolated when required.
  - id: no-auto-dispatch
    instruction: All mobilization actions must wait for MO approval.

actions:
  - id: technical-isolation
    requirement: must
    teamSlug: ops
    title: Isolate affected infrastructure and support engineering assessment
    instructions: Shut down relevant power or systems and maintain safe technical access for qualified engineers and responders.
    peopleNeeded: null

  - id: collapse-perimeter
    requirement: must
    teamSlug: security
    title: Establish a hard exclusion perimeter
    instructions: Prevent public and staff access to the collapse zone and protect rescue and engineering access.
    peopleNeeded: null

  - id: reroute-crowd
    requirement: must
    teamSlug: crowd
    title: Reroute pedestrian flow around the exclusion zone
    instructions: Use approved alternate routes and prevent queue build-up near blocked paths.
    peopleNeeded: null

  - id: casualty-triage
    requirement: must
    teamSlug: first-aid
    title: Establish casualty triage outside the collapse zone
    instructions: Prepare for trauma, crush injury, falls, and secondary medical emergencies.
    peopleNeeded: null

  - id: closure-message
    requirement: must
    teamSlug: info
    title: Communicate closures and safe alternatives
    instructions: State which routes or venues are closed and direct patrons only to approved alternatives.
    peopleNeeded: null

  - id: displaced-patron-support
    requirement: must
    teamSlug: welfare
    title: Support displaced and vulnerable patrons
    instructions: Assist with safe relocation, lost-person issues, accessibility needs, and family reunification.
    peopleNeeded: null

  - id: backstage-restriction
    requirement: must
    teamSlug: artist
    title: Stop performer and crew access to affected backstage areas
    instructions: Hold or relocate affected performances according to MO-approved plans.
    peopleNeeded: 2

  - id: nearby-vendor-shutdown
    requirement: must
    teamSlug: vendors
    title: Close vendor operations within the exclusion area
    instructions: Secure gas, power, equipment, and stock without entering unsafe structure zones.
