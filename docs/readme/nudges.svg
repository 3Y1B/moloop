<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="496" viewBox="0 0 880 496" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Nudges</title>
  <desc id="d">A free volunteer hears a new task read aloud; a busy one gets a ping and the task queues. Unanswered P2 and P3 tasks get a nudge at 2 minutes and the lead is alerted 3 minutes later; P1 goes straight to the lead at 2 minutes. An unanswered need-help request moves from the lead to Mo after 1, 2 or 3 minutes by priority.</desc>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <symbol id="i-volume" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5Z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.4 18.4a9 9 0 0 0 0-12.8"/></g></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M3.26 15.33A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.67C19.41 13.96 18 12.5 18 8A6 6 0 0 0 6 8c0 4.5-1.41 5.96-2.74 7.33"/></g></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g></symbol>
    <symbol id="i-buoy" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/><circle cx="12" cy="12" r="4"/></g></symbol>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="495" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>

  <text x="32" y="46" font-size="18" font-weight="600" fill="#0F172A">Nudges</text>
  <text x="32" y="70" font-size="14" fill="#64748B">How a new task reaches a volunteer, and what happens when nobody answers.</text>

  <!-- Delivery -->
  <g filter="url(#sh)"><rect x="32" y="96" width="400" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="66" cy="128" r="17" fill="#EEF3FE"/>
  <use xlink:href="#i-volume" x="57" y="119" width="18" height="18" stroke="#2F6BF5"/>
  <text x="96" y="123" font-size="15" font-weight="600" fill="#0F172A">Free: read aloud</text>
  <text x="96" y="143" font-size="13" fill="#64748B">“New task: &lt;title&gt;. &lt;summary&gt;”</text>

  <g filter="url(#sh)"><rect x="448" y="96" width="400" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="482" cy="128" r="17" fill="#F5F7FB"/>
  <use xlink:href="#i-bell" x="473" y="119" width="18" height="18" stroke="#64748B"/>
  <text x="512" y="123" font-size="15" font-weight="600" fill="#0F172A">Busy: ping, task queued</text>
  <text x="512" y="143" font-size="13" fill="#64748B">“New task queued: &lt;title&gt;. Check the app.”</text>

  <!-- When nobody answers -->
  <text x="32" y="200" font-size="12" font-weight="600" fill="#64748B" letter-spacing="0.08em">WHEN NOBODY ANSWERS</text>
  <text x="848" y="200" font-size="12" fill="#64748B" text-anchor="end">Past ETA counts the same. Silence never closes a task.</text>

  <!-- Lane 1: P2, P3 -->
  <rect x="32" y="223" width="84" height="26" rx="13" fill="#F5F7FB" stroke="#E2E8F0"/>
  <text x="74" y="240.5" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">P2, P3</text>
  <line x1="216" y1="236" x2="454" y2="236" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="486" y1="236" x2="724" y2="236" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="277" y="225" width="116" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="335" y="240" font-size="12" fill="#64748B" text-anchor="middle">2 min, no accept</text>
  <rect x="575" y="225" width="60" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="605" y="240" font-size="12" fill="#64748B" text-anchor="middle">+3 min</text>

  <circle cx="200" cy="236" r="16" fill="#2F6BF5"/>
  <use xlink:href="#i-user" x="191" y="227" width="18" height="18" stroke="#FFFFFF"/>
  <text x="200" y="272" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Assigned</text>
  <text x="200" y="289" font-size="13" fill="#64748B" text-anchor="middle">Spoken + push</text>

  <g filter="url(#sh)"><circle cx="470" cy="236" r="16" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <use xlink:href="#i-bell" x="461" y="227" width="18" height="18" stroke="#2F6BF5"/>
  <text x="470" y="272" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Nudge</text>
  <text x="470" y="289" font-size="13" fill="#64748B" text-anchor="middle">“Can you take it?”</text>

  <g filter="url(#sh)"><circle cx="740" cy="236" r="16" fill="#FFFFFF" stroke="#C26A00"/></g>
  <use xlink:href="#i-users" x="731" y="227" width="18" height="18" stroke="#C26A00"/>
  <text x="740" y="272" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Lead alerted</text>
  <text x="740" y="289" font-size="13" fill="#64748B" text-anchor="middle">“Tom went quiet: …”</text>

  <!-- Lane 2: P1 -->
  <rect x="32" y="315" width="84" height="26" rx="13" fill="#FDECEA"/>
  <text x="74" y="332.5" font-size="13" font-weight="600" fill="#D92D20" text-anchor="middle">P1</text>
  <line x1="216" y1="328" x2="454" y2="328" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="308" y="317" width="54" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="335" y="332" font-size="12" fill="#64748B" text-anchor="middle">2 min</text>

  <circle cx="200" cy="328" r="16" fill="#2F6BF5"/>
  <use xlink:href="#i-user" x="191" y="319" width="18" height="18" stroke="#FFFFFF"/>
  <text x="200" y="364" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Assigned</text>
  <text x="200" y="381" font-size="13" fill="#64748B" text-anchor="middle">Spoken + push</text>

  <g filter="url(#sh)"><circle cx="470" cy="328" r="16" fill="#FFFFFF" stroke="#D92D20"/></g>
  <use xlink:href="#i-users" x="461" y="319" width="18" height="18" stroke="#D92D20"/>
  <text x="470" y="364" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Lead alerted</text>
  <text x="470" y="381" font-size="13" fill="#64748B" text-anchor="middle">No nudge for P1</text>

  <!-- Lane 3: Need help -->
  <rect x="32" y="407" width="84" height="26" rx="13" fill="#F5F7FB" stroke="#E2E8F0"/>
  <text x="74" y="424.5" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Need help</text>
  <line x1="216" y1="420" x2="724" y2="420" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="356" y="409" width="228" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="470" y="424" font-size="12" fill="#64748B" text-anchor="middle">Unanswered: P1 1 min, P2 2, P3 3</text>

  <circle cx="200" cy="420" r="16" fill="#2F6BF5"/>
  <use xlink:href="#i-buoy" x="191" y="411" width="18" height="18" stroke="#FFFFFF"/>
  <text x="200" y="456" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Asked for help</text>
  <text x="200" y="473" font-size="13" fill="#64748B" text-anchor="middle">Goes to the lead</text>

  <g filter="url(#sh)"><circle cx="740" cy="420" r="16" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <use xlink:href="#i-user" x="731" y="411" width="18" height="18" stroke="#2F6BF5"/>
  <text x="740" y="456" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Bumped to Mo</text>
  <text x="740" y="473" font-size="13" fill="#64748B" text-anchor="middle">or the lead taps Pass to Mo</text>
</svg>
