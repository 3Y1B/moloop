<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="396" viewBox="0 0 880 396" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Roster no-shows</title>
  <desc id="d">Ten minutes before a rostered shift the volunteer gets a reminder ping. If they are still not on duty fifteen minutes after the start, the shift is marked no-show and the team lead gets a message naming who is free to cover. Going on duty later checks them in and clears it.</desc>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 1.5 8.5 5 2 8.5" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="i-bell" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M3.26 15.33A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.67C19.41 13.96 18 12.5 18 8A6 6 0 0 0 6 8c0 4.5-1.41 5.96-2.74 7.33"/></g></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><path d="M17.5 17.5 16 16.3V14"/><circle cx="16" cy="16" r="6"/></g></symbol>
    <symbol id="i-userx" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m17 8 5 5"/><path d="m22 8-5 5"/></g></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g></symbol>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="395" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>

  <text x="32" y="46" font-size="18" font-weight="600" fill="#0F172A">Roster no-shows</text>
  <text x="32" y="70" font-size="14" fill="#64748B">Not on duty 15 min after a shift starts: the lead hears who can cover.</text>

  <!-- Timeline -->
  <line x1="170" y1="156" x2="400" y2="156" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="440" y1="156" x2="670" y2="156" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="525" y="145" width="60" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="555" y="160" font-size="12" fill="#64748B" text-anchor="middle">15 min</text>

  <text x="150" y="124" font-size="13" fill="#64748B" text-anchor="middle">−10 min</text>
  <g filter="url(#sh)"><circle cx="150" cy="156" r="18" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <use xlink:href="#i-bell" x="140" y="146" width="20" height="20" stroke="#2F6BF5"/>
  <text x="150" y="198" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">Reminder ping</text>
  <text x="150" y="217" font-size="13" fill="#64748B" text-anchor="middle">“Go on duty when you’re there.”</text>

  <text x="420" y="124" font-size="13" fill="#64748B" text-anchor="middle">2:00pm</text>
  <g filter="url(#sh)"><circle cx="420" cy="156" r="18" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <use xlink:href="#i-cal" x="410" y="146" width="20" height="20" stroke="#2F6BF5"/>
  <text x="420" y="198" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">Shift starts</text>
  <text x="420" y="217" font-size="13" fill="#64748B" text-anchor="middle">Tom still off duty</text>

  <text x="690" y="124" font-size="13" fill="#64748B" text-anchor="middle">+15 min</text>
  <g filter="url(#sh)"><circle cx="690" cy="156" r="18" fill="#FFFFFF" stroke="#C26A00"/></g>
  <use xlink:href="#i-userx" x="680" y="146" width="20" height="20" stroke="#C26A00"/>
  <text x="690" y="198" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">No-show</text>
  <text x="690" y="217" font-size="13" fill="#64748B" text-anchor="middle">Shift marked no-show</text>

  <!-- Branches -->
  <path d="M690 228 V268" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M690 244 H214 Q204 244 204 254 V268" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ah)"/>

  <!-- Late -->
  <g filter="url(#sh)"><rect x="32" y="272" width="344" height="92" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="66" cy="318" r="17" fill="#E8F5EF"/>
  <use xlink:href="#i-check" x="57" y="309" width="18" height="18" stroke="#1F8A5B"/>
  <text x="96" y="312" font-size="15" font-weight="600" fill="#0F172A">Goes on duty late</text>
  <text x="96" y="332" font-size="13" fill="#64748B">Checked in, no-show cleared</text>

  <!-- Lead -->
  <g filter="url(#sh)"><rect x="400" y="272" width="448" height="92" rx="14" fill="#FFFFFF" stroke="#C26A00"/></g>
  <use xlink:href="#i-users" x="416" y="286" width="16" height="16" stroke="#C26A00"/>
  <text x="440" y="299" font-size="13" fill="#64748B">Team lead (or Mo) gets</text>
  <text x="416" y="322" font-size="14" font-weight="600" fill="#0F172A">“Tom Becker not in for 2:00pm. Free to cover: …”</text>
  <rect x="416" y="334" width="80" height="20" rx="10" fill="#F5F7FB"/>
  <text x="456" y="348" font-size="12" fill="#334155" text-anchor="middle">Same team</text>
  <rect x="502" y="334" width="122" height="20" rx="10" fill="#F5F7FB"/>
  <text x="563" y="348" font-size="12" fill="#334155" text-anchor="middle">Free till shift end</text>
  <rect x="630" y="334" width="80" height="20" rx="10" fill="#F5F7FB"/>
  <text x="670" y="348" font-size="12" fill="#334155" text-anchor="middle">Certs held</text>
  <rect x="716" y="334" width="96" height="20" rx="10" fill="#F5F7FB"/>
  <text x="764" y="348" font-size="12" fill="#334155" text-anchor="middle">Not on a task</text>
</svg>
