<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 476" width="880" height="476" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Task lifecycle</title>
  <desc id="d">Task states: open, queued, assigned, accepted, escalated, resolved, cancelled, and the moves between them. Chips show what the volunteer and the lead or Mo can do. Proposed, held, nudged and quiet are overlays, not states.</desc>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0F172A" flood-opacity="0.07"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="i-dashed" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.1 2.18a10 10 0 0 1 3.8 0"/><path d="M13.9 21.82a10 10 0 0 1-3.8 0"/><path d="M17.61 3.72a10 10 0 0 1 2.69 2.7"/><path d="M2.18 13.9a10 10 0 0 1 0-3.8"/><path d="M20.28 17.61a10 10 0 0 1-2.7 2.69"/><path d="M21.82 10.1a10 10 0 0 1 0 3.8"/><path d="M3.72 6.39a10 10 0 0 1 2.7-2.69"/><path d="M6.39 20.28a10 10 0 0 1-2.69-2.7"/></g>
    <g id="i-inbox" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g>
    <g id="i-send" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></g>
    <g id="i-usercheck" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></g>
    <g id="i-buoy" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/><circle cx="12" cy="12" r="4"/></g>
    <g id="i-check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
    <g id="i-x" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="475" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="32" y="44" font-size="17" font-weight="600" fill="#0F172A">Task lifecycle</text>
  <text x="32" y="66" font-size="13" fill="#64748B">One active task per volunteer.</text>
  <g font-size="12">
    <rect x="664" y="30" width="78" height="22" rx="6" fill="#EAF0FE"/><text x="703" y="45" text-anchor="middle" font-weight="600" fill="#2F6BF5">Volunteer</text>
    <rect x="748.5" y="30.5" width="99" height="21" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="798" y="45" text-anchor="middle" fill="#0F172A">Lead or Mo</text>
  </g>
  <g fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)">
    <path d="M198 190 H246"/>
    <path d="M414 190 H462"/>
    <path d="M630 190 H678"/>
    <path d="M300 132 C300 104, 160 104, 160 130"/>
    <path d="M760 132 C760 66, 72 66, 72 130"/>
    <path d="M116 260 C116 290, 180 284, 180 310"/>
    <path d="M290 312 V262"/>
    <path d="M464 362 H392 Q380 362 380 350 V262"/>
    <path d="M516 260 V310"/>
    <path d="M590 312 V262"/>
    <path d="M630 336 C672 336, 716 300, 716 262"/>
    <path d="M630 392 H678"/>
  </g>
  <g font-size="13" fill="#0F172A">
    <text x="222" y="182" text-anchor="middle">sent</text>
    <text x="438" y="182" text-anchor="middle">accept</text>
    <text x="654" y="182" text-anchor="middle">done</text>
    <rect x="202" y="96" width="56" height="18" fill="#FFFFFF"/><text x="230" y="109" text-anchor="middle">decline</text>
    <rect x="352" y="73" width="136" height="20" fill="#FFFFFF"/><text x="420" y="87" text-anchor="middle">“Still need help?”</text>
    <text x="108" y="292" text-anchor="end">busy</text>
    <text x="282" y="292" text-anchor="end">freed</text>
    <text x="388" y="334">reassign</text>
    <text x="508" y="292" text-anchor="end">need help</text>
    <text x="598" y="284">backup,</text><text x="598" y="300">carry on</text>
    <text x="728" y="284">done,</text><text x="728" y="300">arrived</text>
    <text x="654" y="384" text-anchor="middle">close</text>
  </g>
  <g font-size="12">
    <g><rect x="32" y="132" width="166" height="128" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/><use href="#i-dashed" transform="translate(46 144) scale(0.75)" color="#0F172A"/><text x="72" y="159" font-size="15" font-weight="600" fill="#0F172A">open</text><rect x="46" y="172" width="78" height="20" rx="10" fill="#EAF0FE"/><circle cx="56" cy="182" r="3" fill="#2F6BF5"/><text x="63" y="186" fill="#2F6BF5">Proposed</text><rect x="130" y="172" width="51" height="20" rx="10" fill="#FCF0E1"/><circle cx="140" cy="182" r="3" fill="#C26A00"/><text x="147" y="186" fill="#C26A00">Held</text><text x="46" y="215" fill="#64748B">Not sent yet</text><rect x="46.5" y="228.5" width="62" height="21" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="77.5" y="243" text-anchor="middle" fill="#0F172A">Approve</text><rect x="115.5" y="228.5" width="52" height="21" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="141.5" y="243" text-anchor="middle" fill="#0F172A">Assign</text></g><g><rect x="248" y="132" width="166" height="128" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/><use href="#i-send" transform="translate(262 144) scale(0.75)" color="#2F6BF5"/><text x="288" y="159" font-size="15" font-weight="600" fill="#0F172A">assigned</text><rect x="262" y="172" width="69" height="20" rx="10" fill="#F1F2F5"/><circle cx="272" cy="182" r="3" fill="#475569"/><text x="279" y="186" fill="#475569">Nudged</text><rect x="337" y="172" width="57" height="20" rx="10" fill="#FCF0E1"/><circle cx="347" cy="182" r="3" fill="#C26A00"/><text x="354" y="186" fill="#C26A00">Quiet</text><rect x="262" y="200" width="53" height="22" rx="6" fill="#EAF0FE"/><text x="288.5" y="215" text-anchor="middle" font-weight="600" fill="#2F6BF5">Accept</text><rect x="321" y="200" width="59" height="22" rx="6" fill="#EAF0FE"/><text x="350.5" y="215" text-anchor="middle" font-weight="600" fill="#2F6BF5">Decline</text><rect x="262.5" y="228.5" width="36" height="21" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="280.5" y="243" text-anchor="middle" fill="#0F172A">Call</text><rect x="305.5" y="228.5" width="64" height="21" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="337.5" y="243" text-anchor="middle" fill="#0F172A">Reassign</text></g><g><rect x="464" y="132" width="166" height="128" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/><use href="#i-usercheck" transform="translate(478 144) scale(0.75)" color="#2F6BF5"/><text x="504" y="159" font-size="15" font-weight="600" fill="#0F172A">accepted</text><rect x="478" y="172" width="69" height="20" rx="10" fill="#F1F2F5"/><circle cx="488" cy="182" r="3" fill="#475569"/><text x="495" y="186" fill="#475569">Nudged</text><rect x="553" y="172" width="57" height="20" rx="10" fill="#FCF0E1"/><circle cx="563" cy="182" r="3" fill="#C26A00"/><text x="570" y="186" fill="#C26A00">Quiet</text><rect x="478" y="200" width="45" height="22" rx="6" fill="#EAF0FE"/><text x="500.5" y="215" text-anchor="middle" font-weight="600" fill="#2F6BF5">Done</text><rect x="529" y="200" width="72" height="22" rx="6" fill="#EAF0FE"/><text x="565" y="215" text-anchor="middle" font-weight="600" fill="#2F6BF5">Need help</text><rect x="478.5" y="228.5" width="36" height="21" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="496.5" y="243" text-anchor="middle" fill="#0F172A">Call</text><rect x="521.5" y="228.5" width="64" height="21" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="553.5" y="243" text-anchor="middle" fill="#0F172A">Reassign</text></g><g><rect x="680" y="132" width="166" height="128" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/><use href="#i-check" transform="translate(694 144) scale(0.75)" color="#1F8A5B"/><text x="720" y="159" font-size="15" font-weight="600" fill="#1F8A5B">resolved</text><text fill="#64748B"><tspan x="694" y="188">Done, or handed over</tspan><tspan x="694" y="206">to medics or security</tspan></text></g><g><rect x="140" y="312" width="166" height="100" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/><use href="#i-inbox" transform="translate(154 324) scale(0.75)" color="#0F172A"/><text x="180" y="339" font-size="15" font-weight="600" fill="#0F172A">queued</text><text x="154" y="367" fill="#64748B">Starts when free</text><rect x="154.5" y="380.5" width="52" height="21" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="180.5" y="395" text-anchor="middle" fill="#0F172A">Assign</text></g><g><rect x="464" y="312" width="166" height="100" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/><use href="#i-buoy" transform="translate(478 324) scale(0.75)" color="#D92D20"/><text x="504" y="339" font-size="15" font-weight="600" fill="#D92D20">escalated</text><rect x="478" y="352" width="45" height="22" rx="6" fill="#EAF0FE"/><text x="500.5" y="367" text-anchor="middle" font-weight="600" fill="#2F6BF5">Done</text><rect x="529" y="352" width="71" height="22" rx="6" fill="#EAF0FE"/><text x="564.5" y="367" text-anchor="middle" font-weight="600" fill="#2F6BF5">Still on it</text><rect x="478.5" y="380.5" width="57" height="21" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="507" y="395" text-anchor="middle" fill="#0F172A">Backup</text><rect x="542.5" y="380.5" width="73" height="21" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="579" y="395" text-anchor="middle" fill="#0F172A">Hand over</text></g><g><rect x="680" y="312" width="166" height="100" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/><use href="#i-x" transform="translate(694 324) scale(0.75)" color="#64748B"/><text x="720" y="339" font-size="15" font-weight="600" fill="#64748B">cancelled</text><text fill="#64748B"><tspan x="694" y="367">Closed, cancelled</tspan><tspan x="694" y="385">or stood down</tspan></text></g>
  </g>
  <g font-size="12">
    <rect x="32" y="436" width="78" height="20" rx="10" fill="#EAF0FE"/><circle cx="42" cy="446" r="3" fill="#2F6BF5"/><text x="49" y="450" fill="#2F6BF5">Proposed</text><text x="118" y="450" fill="#64748B">awaits approval, 30 s</text><rect x="282.6" y="436" width="51" height="20" rx="10" fill="#FCF0E1"/><circle cx="292.6" cy="446" r="3" fill="#C26A00"/><text x="299.6" y="450" fill="#C26A00">Held</text><text x="341.6" y="450" fill="#64748B">waits for a call</text><rect x="473.20000000000005" y="436" width="69" height="20" rx="10" fill="#F1F2F5"/><circle cx="483.20000000000005" cy="446" r="3" fill="#475569"/><text x="490.20000000000005" y="450" fill="#475569">Nudged</text><text x="550.2" y="450" fill="#64748B">no reply in time</text><rect x="681.8000000000001" y="436" width="57" height="20" rx="10" fill="#FCF0E1"/><circle cx="691.8000000000001" cy="446" r="3" fill="#C26A00"/><text x="698.8000000000001" y="450" fill="#C26A00">Quiet</text><text x="746.8000000000001" y="450" fill="#64748B">lead alerted</text>
  </g>
</svg>
