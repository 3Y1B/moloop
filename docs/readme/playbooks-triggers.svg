<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="460" viewBox="0 0 880 460" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Playbooks and triggers</title>
  <desc id="d">Mo writes four playbooks before the festival: severe storm, crowd surge, extreme heat and gate breach. Each lists must-do actions, one per team, and sensor lines. Four triggers start a plan for Mo: T1 a serious report, T2 reports adding up, T3 a reading over a line, T4 Mo says so.</desc>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 1.5 8.5 5 2 8.5" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 1.5 8.5 5 2 8.5" fill="none" stroke="#2F6BF5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="i-storm" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.326A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.973"/><path d="m13 12-3 5h4l-3 5"/></g></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g></symbol>
    <symbol id="i-heat" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></g></symbol>
    <symbol id="i-gate" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20H2"/><path d="M11 4.562v16.157a1 1 0 0 0 1.242.97L19 20V5.562a2 2 0 0 0-1.515-1.94l-4-1A2 2 0 0 0 11 4.561z"/><path d="M11 4H8a2 2 0 0 0-2 2v14"/><path d="M14 12h.01"/><path d="M22 20h-3"/></g></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></g></symbol>
    <symbol id="i-msgs" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/></g></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></g></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></g></symbol>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="459" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- Header -->
  <text x="32" y="44" font-size="18" font-weight="600" fill="#0F172A">Playbooks and triggers</text>
  <text x="32" y="66" font-size="13" fill="#64748B">Mo writes four playbooks before the festival. Any of four triggers starts a plan.</text>

  <!-- Section labels -->
  <g font-size="12" font-weight="600" fill="#64748B" letter-spacing="0.08em">
    <text x="32" y="100">PLAYBOOKS</text>
    <text x="420" y="100">TRIGGERS</text>
    <text x="708" y="100">THEN</text>
  </g>

  <!-- ===== Playbooks card ===== -->
  <g filter="url(#sh)"><rect x="32" y="116" width="360" height="312" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>

  <!-- the four -->
  <rect x="50" y="136" width="158" height="36" rx="10" fill="#EEF3FE" stroke="#2F6BF5"/>
  <use xlink:href="#i-storm" x="62" y="146" width="16" height="16" stroke="#2F6BF5"/>
  <text x="86" y="159" font-size="13" font-weight="600" fill="#0F172A">Severe storm</text>

  <rect x="216" y="136" width="158" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <use xlink:href="#i-users" x="228" y="146" width="16" height="16" stroke="#64748B"/>
  <text x="252" y="159" font-size="13" font-weight="500" fill="#0F172A">Crowd surge</text>

  <rect x="50" y="180" width="158" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <use xlink:href="#i-heat" x="62" y="190" width="16" height="16" stroke="#64748B"/>
  <text x="86" y="203" font-size="13" font-weight="500" fill="#0F172A">Extreme heat</text>

  <rect x="216" y="180" width="158" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <use xlink:href="#i-gate" x="228" y="190" width="16" height="16" stroke="#64748B"/>
  <text x="252" y="203" font-size="13" font-weight="500" fill="#0F172A">Gate breach</text>

  <path d="M50 236 H374" stroke="#E2E8F0"/>

  <!-- inside one -->
  <text x="50" y="262" font-size="12" font-weight="600" fill="#64748B">Must do, one per team</text>
  <g font-size="12" fill="#0F172A" text-anchor="middle">
    <rect x="50" y="274" width="54" height="22" rx="11" fill="#F5F7FB" stroke="#E2E8F0"/><text x="77" y="289">Crowd</text>
    <rect x="110" y="274" width="46" height="22" rx="11" fill="#F5F7FB" stroke="#E2E8F0"/><text x="133" y="289">Tech</text>
    <rect x="162" y="274" width="64" height="22" rx="11" fill="#F5F7FB" stroke="#E2E8F0"/><text x="194" y="289">Artists</text>
    <rect x="232" y="274" width="74" height="22" rx="11" fill="#F5F7FB" stroke="#E2E8F0"/><text x="269" y="289">First Aid</text>
    <rect x="312" y="274" width="44" height="22" rx="11" fill="#F5F7FB" stroke="#E2E8F0"/><text x="334" y="289">Info</text>
    <rect x="50" y="302" width="66" height="22" rx="11" fill="#F5F7FB" stroke="#E2E8F0"/><text x="83" y="317">Welfare</text>
    <rect x="122" y="302" width="70" height="22" rx="11" fill="#F5F7FB" stroke="#E2E8F0"/><text x="157" y="317">Security</text>
    <rect x="198" y="302" width="66" height="22" rx="11" fill="#F5F7FB" stroke="#E2E8F0"/><text x="231" y="317">Vendors</text>
  </g>

  <text x="50" y="354" font-size="12" font-weight="600" fill="#64748B">Sensor lines</text>
  <g fill="#2F6BF5"><circle cx="54" cy="372" r="2.5"/><circle cx="54" cy="391" r="2.5"/><circle cx="54" cy="410" r="2.5"/></g>
  <g font-size="12" fill="#0F172A">
    <text x="66" y="376">Wind over 60 km/h at a stage</text>
    <text x="66" y="395">Lightning under 10 km</text>
    <text x="66" y="414">Storm warning, or stage wind limit hit</text>
  </g>

  <!-- sensor lines feed T3 -->
  <path d="M392 384 C406 384 404 312 418 312" fill="none" stroke="#2F6BF5" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#ahb)"/>

  <!-- ===== Triggers ===== -->
  <!-- T1 -->
  <g filter="url(#sh)"><rect x="420" y="116" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <rect x="434" y="128" width="32" height="32" rx="9" fill="#EAF0FE"/>
  <use xlink:href="#i-alert" x="440" y="134" width="20" height="20" stroke="#2F6BF5"/>
  <text x="478" y="142" font-size="14" font-weight="600" fill="#0F172A"><tspan fill="#2F6BF5">T1</tspan>  Serious report</text>
  <text font-size="12" fill="#64748B"><tspan x="478" y="162">A report naming a playbook,</tspan><tspan x="478" y="177">P1 or intake is sure</tspan></text>

  <!-- T2 -->
  <g filter="url(#sh)"><rect x="420" y="196" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <rect x="434" y="208" width="32" height="32" rx="9" fill="#EAF0FE"/>
  <use xlink:href="#i-msgs" x="440" y="214" width="20" height="20" stroke="#2F6BF5"/>
  <text x="478" y="222" font-size="14" font-weight="600" fill="#0F172A"><tspan fill="#2F6BF5">T2</tspan>  Reports add up</text>
  <text font-size="12" fill="#64748B"><tspan x="478" y="242">3+ reports in one zone in 10 min;</tspan><tspan x="478" y="257">a model check names one</tspan></text>

  <!-- T3 -->
  <g filter="url(#sh)"><rect x="420" y="276" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <rect x="434" y="288" width="32" height="32" rx="9" fill="#EAF0FE"/>
  <use xlink:href="#i-gauge" x="440" y="294" width="20" height="20" stroke="#2F6BF5"/>
  <text x="478" y="302" font-size="14" font-weight="600" fill="#0F172A"><tspan fill="#2F6BF5">T3</tspan>  Reading over a line</text>
  <text font-size="12" fill="#64748B"><tspan x="478" y="322">A sensor reading crosses a</tspan><tspan x="478" y="337">playbook line. Rules, not AI</tspan></text>

  <!-- T4 -->
  <g filter="url(#sh)"><rect x="420" y="356" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <rect x="434" y="368" width="32" height="32" rx="9" fill="#EAF0FE"/>
  <use xlink:href="#i-user" x="440" y="374" width="20" height="20" stroke="#2F6BF5"/>
  <text x="478" y="382" font-size="14" font-weight="600" fill="#0F172A"><tspan fill="#2F6BF5">T4</tspan>  Mo says so</text>
  <text font-size="12" fill="#64748B"><tspan x="478" y="402">Mo’s own report</tspan><tspan x="478" y="417">names a playbook</tspan></text>

  <!-- converge -->
  <g fill="none" stroke="#94A3B8" stroke-width="1.5">
    <path d="M680 152 C696 152 690 272 706 272" marker-end="url(#ah)"/>
    <path d="M680 232 C696 232 690 272 706 272" marker-end="url(#ah)"/>
    <path d="M680 312 C696 312 690 272 706 272" marker-end="url(#ah)"/>
    <path d="M680 392 C696 392 690 272 706 272" marker-end="url(#ah)"/>
  </g>

  <!-- ===== Plan ===== -->
  <g filter="url(#sh)"><rect x="708" y="198" width="140" height="148" rx="14" fill="#FFFFFF" stroke="#2F6BF5"/></g>
  <rect x="724" y="214" width="32" height="32" rx="9" fill="#EAF0FE"/>
  <use xlink:href="#i-spark" x="730" y="220" width="20" height="20" stroke="#2F6BF5"/>
  <text x="724" y="274" font-size="14" font-weight="600" fill="#0F172A">Plan for Mo</text>
  <text font-size="12" fill="#64748B"><tspan x="724" y="294">One per playbook</tspan><tspan x="724" y="310">and zone. Later</tspan><tspan x="724" y="326">causes join it.</tspan></text>
</svg>
